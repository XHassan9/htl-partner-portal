<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Partner portal · Hassan Transportation &amp; Logistics</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#2a2470,#0d0c1a 60%);font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#f2f1f8}.c{background:#15142a;border:1px solid #2c2a4d;border-radius:16px;padding:30px 34px;width:min(400px,90vw);text-align:center}h1{font-size:21px;margin:0 0 6px}p{color:#a9a7c0;font-size:14px;margin:0 0 16px}input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #2c2a4d;background:#0f0e20;color:#f2f1f8;font-size:16px;text-align:center;letter-spacing:.04em}button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:9px;background:#ff8a3d;color:#1b1004;font-weight:600;font-size:15px;cursor:pointer}.e{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:8px}.t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9d95ff;font-weight:700;margin-bottom:10px}</style></head>
<body><form class="c" id="f"><div class="t">Hassan Transportation &amp; Logistics</div><h1>Private partner portal</h1><p>Enter the access code from your HTL invitation.</p><input id="c" type="password" autocomplete="off" placeholder="Access code" aria-label="Access code"><button id="b">Open</button><div class="e" id="e"></div><p style="margin:14px 0 0;font-size:12px">Confidential. Powered by TAZ TMS.</p></form>
<script>(function(){const $=i=>document.getElementById(i);
async function open(pw,quiet){if(!window.crypto||!crypto.subtle){$('e').textContent='Open this page over its https link in a current browser.';return}$('b').textContent='Opening…';try{const b=new Uint8Array(await(await fetch('p.enc',{cache:'no-store'})).arrayBuffer());const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28));const html=new TextDecoder().decode(pt);try{sessionStorage.setItem('pk',pw);sessionStorage.setItem('ok','1')}catch(x){}document.open();document.write(html);document.close()}catch(x){try{sessionStorage.removeItem('pk')}catch(y){}$('b').textContent='Open';if(!quiet)$('e').textContent='That code does not match. Check your invitation.'}}
$('f').addEventListener('submit',e=>{e.preventDefault();const v=$('c').value.trim().toUpperCase();if(v)open(v)});
let s=null;try{s=sessionStorage.getItem('pk')}catch(x){}if(s)open(s,true)})();</script></body></html>
