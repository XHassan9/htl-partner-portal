const COLS='id,shipper_ref,carrier_label_id,tracking_number,status,site_id,service,weight_lb,dest_city,dest_state,dest_zip,created_at,promised_date,delivered_at';
async function shipments(){const{data,count,error}=await shipQ(COLS,{count:'exact'}).range(F.page*PG,F.page*PG+PG-1);if(error)throw error;const sc=id=>{const s=ME.sites.find(x=>x.id===id);return s?s.code:''};
$('#m').innerHTML=`<div class="row"><h1 style="flex:1">Shipments</h1><button class="btn gh" id="ex">Export CSV</button></div><form class="row" id="sf"><input id="sq" placeholder="Search ref, label ID, tracking number or ZIP" value="${esc(F.q)}" style="flex:1;min-width:220px"><select id="ss"><option value="">All statuses</option>${Object.keys(SL).map(k=>`<option value="${k}" ${F.status==k?'selected':''}>${SL[k]}</option>`).join('')}</select><select id="si"><option value="">All sites</option>${ME.sites.map(x=>`<option value="${x.id}" ${F.site==x.id?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select><input id="se" placeholder="State" maxlength="2" size="5" value="${esc(F.state)}"><button class="btn">Search</button><button class="btn gh" type="button" id="sc">Clear</button></form>
<div class="card tw" style="padding:6px"><table><tr><th>Shipper ref</th><th>Label ID</th><th>Status</th><th>Site</th><th>Destination</th><th>Weight</th><th>Created</th><th>Promised</th><th>Delivered</th></tr>${(data||[]).map(r=>`<tr class="cl" data-id="${r.id}"><td><b>${esc(r.shipper_ref)}</b></td><td>${esc(r.carrier_label_id)}</td><td>${stp(r.status)}</td><td>${esc(sc(r.site_id))}</td><td>${esc([r.dest_city,r.dest_state].filter(Boolean).join(', '))} ${esc(r.dest_zip)}</td><td>${r.weight_lb??''} lb</td><td>${dt(r.created_at)}</td><td>${r.promised_date?dd(r.promised_date+'T12:00'):''}</td><td>${dt(r.delivered_at)}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">No shipments match.</td></tr>'}</table></div>
<div class="row" style="margin-top:12px"><span class="mu sm" style="flex:1">${f0(count)} shipments · page ${F.page+1} of ${Math.max(1,Math.ceil(count/PG))}</span><button class="btn gh sm" id="pp" ${F.page?'':'disabled'}>Previous</button><button class="btn gh sm" id="pn" ${(F.page+1)*PG<count?'':'disabled'}>Next</button></div>`;
$('#sf').onsubmit=e=>{e.preventDefault();F={q:$('#sq').value,status:$('#ss').value,site:$('#si').value,state:$('#se').value.trim(),page:0};go('shipments')};$('#sc').onclick=()=>{F={q:'',status:'',site:'',state:'',page:0};go('shipments')};$('#pp').onclick=()=>{F.page--;go('shipments')};$('#pn').onclick=()=>{F.page++;go('shipments')};
document.querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>openD(r.dataset.id));
$('#ex').onclick=async()=>{const b=$('#ex');b.disabled=true;const rows=[];for(let p=0;p<20;p++){b.textContent='Exporting '+f0(rows.length)+'…';const{data}=await shipQ(COLS).range(p*1000,p*1000+999);if(!data||!data.length)break;rows.push(...data);if(data.length<1000)break}
const h=['shipper_ref','carrier_label_id','tracking_number','status','site','service','weight_lb','dest_city','dest_state','dest_zip','created_at','promised_date','delivered_at'];const csv=[h.join(',')].concat(rows.map(r=>h.map(k=>{const v=k=='site'?sc(r.site_id):r[k];return v==null?'':/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v}).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='shipments.csv';a.click();b.disabled=false;b.textContent=rows.length>=20000?'Exported first 20,000':'Export CSV'}}
async function openD(id){const d=$('#drawer');d.classList.add('on');d.innerHTML='<p class="mu">Loading…</p>';const[s,e]=await Promise.all([sb.from('shipments').select('*').eq('id',id).single(),sb.from('tracking_events').select('*').eq('shipment_id',id).order('occurred_at',{ascending:false})]);const r=s.data;if(!r){d.innerHTML='<p class="err">Not found.</p>';return}const si=ME.sites.find(x=>x.id===r.site_id);
const row=(l,v)=>v==null||v===''?'':`<tr><td class="mu">${l}</td><td style="white-space:normal">${v}</td></tr>`;
d.innerHTML=`<div class="row"><h2 style="flex:1;margin:0">${esc(r.shipper_ref)}</h2><button class="btn gh sm" onclick="closeD()">Close</button></div>${stp(r.status)}<table style="margin-top:10px">${row('Label ID',esc(r.carrier_label_id))}${row('Tracking number',esc(r.tracking_number))}${row('Origin',si?esc(si.code+' · '+si.name):'')}${row('Destination',esc([r.dest_city,r.dest_state,r.dest_zip].filter(Boolean).join(', ')))}${row('Service',esc(r.service))}${row('Weight',r.weight_lb!=null?r.weight_lb+' lb':'')}${row('Dimensions',r.length_in?`${r.length_in} × ${r.width_in} × ${r.height_in} in`:'')}${row('Promised',r.promised_date?dd(r.promised_date+'T12:00'):'')}${row('Delivered',dt(r.delivered_at))}${row('Exception',esc(r.exception_code))}${row('Resolution',esc(r.resolved_note))}</table><h3 style="margin-top:16px">Scan history</h3><div class="tl">${(e.data||[]).map(x=>`<div><b>${SL[x.status]||esc(x.status)}</b>${x.note?' · '+esc(x.note):''}<span>${esc([x.location_city,x.location_state].filter(Boolean).join(', '))} · ${dt(x.occurred_at)}</span></div>`).join('')||'<p class="mu sm">No scans yet.</p>'}</div>`}
function closeD(){$('#drawer').classList.remove('on')}

async function exceptions(){const{data,error}=await sb.from('shipments').select('id,shipper_ref,carrier_label_id,dest_city,dest_state,exception_code,exception_note,created_at,out_for_delivery_at,resolved_at,resolved_note').not('exception_code','is',null).order('created_at',{ascending:false}).limit(300);if(error)throw error;const open=(data||[]).filter(x=>!x.resolved_at),done=(data||[]).filter(x=>x.resolved_at),adm=ME.role==='htl_admin';const age=v=>{const h=(Date.now()-new Date(v))/36e5;return h<48?Math.round(h)+' h':Math.round(h/24)+' d'};
const tb=(rows,o)=>`<div class="card tw" style="padding:6px"><table><tr><th>Shipper ref</th><th>Label ID</th><th>Destination</th><th>Code</th><th>${o?'Age':'Resolved'}</th><th>${o?(adm?'Resolve':''):'Note'}</th></tr>${rows.map(r=>`<tr><td><a href="#" data-o="${r.id}"><b>${esc(r.shipper_ref)}</b></a></td><td>${esc(r.carrier_label_id)}</td><td>${esc([r.dest_city,r.dest_state].filter(Boolean).join(', '))}</td><td>${esc(r.exception_code)}</td><td>${o?age(r.out_for_delivery_at||r.created_at):dd(r.resolved_at)}</td><td>${o?(adm?`<input data-n="${r.id}" placeholder="Resolution note" size="22"> <button class="btn sm" data-r="${r.id}">Mark resolved</button>`:''):esc(r.resolved_note)}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">None.</td></tr>'}</table></div>`;
$('#m').innerHTML=`<h1>Exceptions</h1><p class="mu sm">${open.length} open, ${done.length} resolved (latest 300 shown).</p><h3>Open</h3>${tb(open,true)}<h3 style="margin-top:18px">Resolved</h3>${tb(done,false)}`;
document.querySelectorAll('[data-o]').forEach(a=>a.onclick=e=>{e.preventDefault();openD(a.dataset.o)});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await sb.from('shipments').update({resolved_at:new Date().toISOString(),resolved_note:document.querySelector(`[data-n="${b.dataset.r}"]`).value||'Resolved'}).eq('id',b.dataset.r);if(error){b.disabled=false;b.textContent=error.message}else go('exceptions')})}

async function scorecard(){const s=since(RNG==1?7:RNG);const[a,b,w]=await Promise.all([sb.rpc('scorecard',{_since:s,_group:'site'}),sb.rpc('scorecard',{_since:s,_group:'state'}),sb.rpc('weekly_trend',{_since:since(56)})]);const pc=v=>v==null?'—':v+'%';
const tb=rows=>`<div class="card tw" style="padding:6px"><table><tr><th></th><th>Labels</th><th>Delivered</th><th>On time</th><th>First attempt</th><th>Exception rate</th><th>Avg days</th><th>First scan</th></tr>${(rows||[]).map(r=>`<tr><td><b>${esc(r.grp)}</b></td><td>${f0(r.total)}</td><td>${f0(r.delivered)}</td><td>${pc(r.on_time_pct)}</td><td>${pc(r.first_attempt_pct)}</td><td>${pc(r.exception_rate)}</td><td>${r.avg_days_to_deliver??'—'}</td><td>${r.avg_first_scan_hours!=null?r.avg_first_scan_hours+' h':'—'}</td></tr>`).join('')}</table></div>`;const W=w.data||[];
$('#m').innerHTML=`<div class="row"><h1 style="flex:1">Scorecard</h1><div class="seg" id="rs">${[[7,'7 days'],[30,'30 days']].map(([d,l])=>`<button data-d="${d}" class="${(RNG==1?7:RNG)==d?'on':''}">${l}</button>`).join('')}</div></div><h3>By origin site</h3>${tb(a.data)}
<div class="card" style="margin:14px 0"><h3>On-time delivery by week</h3><div style="display:flex;gap:10px;align-items:flex-end;height:140px">${W.map(x=>`<div style="flex:1;text-align:center;font-size:12px"><div class="mu">${x.on_time_pct??'—'}%</div><div style="background:var(--te);opacity:.8;border-radius:5px 5px 0 0;height:${Math.max(2,((x.on_time_pct||0)-80)*5)}px"></div><div class="mu">${dd(x.week+'T12:00')}</div></div>`).join('')}</div><p class="mu sm" style="margin:8px 0 0">Bars start at 80% so week-to-week changes are visible.</p></div><h3>By destination state</h3>${tb(b.data)}`;bindR(()=>go('scorecard'))}

async function integration(){const adm=ME.role==='htl_admin';const[l,lg,ky]=await Promise.all([sb.rpc('last_event_received'),sb.rpc('ingest_log_summary',{_limit:25}),adm?sb.from('carrier_api_keys').select('*').order('created_at',{ascending:false}):{data:[]}]);const url=SB_URL+'/rest/v1/rpc/carrier_events';
const body=`{
  "api_key": "YOUR_API_KEY",
  "events": [{
    "event_id": "evt_123",
    "event": "tracking.updated",
    "label_id": "LBL-7F3K29",
    "shipper_ref": "REF-48213",
    "tracking_number": "TRK0000000001",
    "status": "out_for_delivery",
    "occurred_at": "2026-11-23T13:42:00-05:00",
    "location": { "city": "Dallas", "state": "TX", "type": "delivery_hub" },
    "exception": null
  }]
}`;
$('#m').innerHTML=`<h1>Integration</h1><p class="mu">How the carrier sends tracking scans into this portal. Last event received: <b style="color:var(--tx)">${l.data?dt(l.data):'none yet'}</b></p>
<div class="grid g2e"><div class="card"><h3>Send tracking events</h3><p class="sm mu">POST up to 500 events per call. Each event is matched to a shipment by label_id, then shipper_ref, then tracking_number.</p><pre>POST ${esc(url)}
apikey: ${esc(SB_KEY)}
Content-Type: application/json</pre><pre>${esc(body)}</pre><p class="sm mu">Statuses: created, picked_up, in_transit, out_for_delivery, delivered, exception, returned. Anything else is stored as in_transit with the original kept. For an exception send "exception": {"code": "address_issue", "message": "..."}. Sending the same event_id twice is safe.</p><p class="sm mu">Response: <code>{"accepted": 1, "duplicates": 0, "rejected": []}</code></p></div>
<div class="card"><h3>Test with curl</h3><pre>curl -X POST '${esc(url)}' \\
  -H 'apikey: ${esc(SB_KEY)}' \\
  -H 'Content-Type: application/json' \\
  -d '{"api_key":"YOUR_API_KEY","events":[{"event_id":"test-1","label_id":"YOUR_LABEL_ID","status":"in_transit","occurred_at":"${new Date().toISOString()}","location":{"city":"Atlanta","state":"GA","type":"hub"}}]}'</pre>
${adm?`<h3 style="margin-top:16px">API keys</h3><div class="row"><input id="kl" placeholder="Label, for example Carrier sandbox" style="flex:1"><button class="btn" id="kc">Create API key</button></div><div id="ko"></div><table>${(ky.data||[]).map(k=>`<tr><td><b>${esc(k.label)}</b><br><span class="mu">${esc(k.key_prefix)}… · created ${dd(k.created_at)} · last used ${k.last_used_at?dt(k.last_used_at):'never'}</span></td><td>${k.revoked_at?'<span class="mu">Revoked</span>':`<button class="btn gh sm" data-rk="${k.id}">Revoke</button>`}</td></tr>`).join('')||'<tr><td class="mu">No keys yet.</td></tr>'}</table>`:'<p class="sm mu">Your API key comes from HTL. Ask Xander if you need a new one.</p>'}
<h3 style="margin-top:16px">Recent calls</h3><table><tr><th>Received</th><th>Result</th><th>Detail</th></tr>${(lg.data||[]).map(x=>`<tr><td>${dt(x.received_at)}</td><td>${x.ok?'<span class="ok">OK</span>':'<span class="err">'+x.http_status+'</span>'}</td><td style="white-space:normal">${esc(x.error)}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">No calls yet.</td></tr>'}</table></div></div>`;
if(adm){$('#kc').onclick=async()=>{const{data,error}=await sb.rpc('admin_create_api_key',{_label:$('#kl').value});$('#ko').innerHTML=error?`<p class="err">${esc(error.message)}</p>`:`<div class="ban">Copy this key now. It is shown once and cannot be recovered.<pre>${esc(data)}</pre></div>`};document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=async()=>{await sb.from('carrier_api_keys').update({revoked_at:new Date().toISOString()}).eq('id',b.dataset.rk);go('integration')})}}

async function admin(){const[iv,pf,dc]=await Promise.all([sb.from('invites').select('*').order('created_at'),sb.from('profiles').select('email,last_seen_at'),sb.rpc('demo_counts')]);const seen={};(pf.data||[]).forEach(p=>seen[(p.email||'').toLowerCase()]=p.last_seen_at);const on=id=>{const o=ME.orgs.find(x=>x.id===id);return o?o.name:''};const D=(dc.data||[])[0]||{};const RL={htl:'htl_admin',carrier:'carrier_user',shipper:'shipper_user'};
$('#m').innerHTML=`<h1>Admin</h1><div class="grid g2e"><div class="card"><h3>People</h3><p class="sm mu">Add a person, then send them the portal link. They enter their email there and get a sign-in link. Each person only sees their own company's side.</p><form class="row" id="af"><input id="ae" type="email" required placeholder="name@company.com" style="flex:1;min-width:180px"><select id="ao">${ME.orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select><button class="btn">Add</button></form><div class="err" id="ar"></div><pre>${esc(PORTAL)}</pre>
<table><tr><th>Email</th><th>Company</th><th>Last seen</th><th></th></tr>${(iv.data||[]).map(i=>`<tr><td>${esc(i.email)}</td><td>${esc(on(i.org_id))}</td><td>${seen[i.email]?dt(seen[i.email]):'<span class="mu">Not yet</span>'}</td><td>${i.email===ME.email.toLowerCase()?'':`<button class="btn gh sm" data-rv="${esc(i.email)}">Remove</button>`}</td></tr>`).join('')}</table></div>
<div><div class="card"><h3>Import shipments (CSV)</h3><p class="sm mu">Columns: shipper_ref, site_code, service, weight_lb, length_in, width_in, height_in, dest_city, dest_state, dest_zip, promised_date. Existing refs are updated.</p><div class="row"><input type="file" id="cf" accept=".csv"><button class="btn gh sm" id="ct">Download template</button></div><div id="cr" class="sm"></div></div>
<div class="card" style="margin-top:14px"><h3>Demo data</h3><p class="sm mu">${f0(D.shipments)} demo shipments and ${f0(D.events)} demo scans are loaded. Remove them when real shipments start.</p><div id="dz"><button class="btn gh" id="dx">Delete all demo data</button></div></div></div></div>`;
$('#af').onsubmit=async e=>{e.preventDefault();const o=ME.orgs.find(x=>x.id===$('#ao').value);const{error}=await sb.from('invites').upsert({email:$('#ae').value.trim().toLowerCase(),org_id:o.id,role:RL[o.kind],invited_by:(await sb.auth.getUser()).data.user.id},{onConflict:'email'});if(error)$('#ar').textContent=error.message;else go('admin')};
document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await sb.rpc('admin_revoke_access',{_email:b.dataset.rv});if(error){$('#ar').textContent=error.message;b.disabled=false}else go('admin')});
$('#dx').onclick=()=>{$('#dz').innerHTML='<span class="sm">This cannot be undone. </span><button class="btn" id="dy" style="background:var(--rd);color:#fff">Yes, delete demo data</button> <button class="btn gh" id="dn">Cancel</button>';$('#dn').onclick=()=>go('admin');$('#dy').onclick=async()=>{$('#dy').disabled=true;$('#dy').textContent='Deleting…';const{error}=await sb.rpc('delete_demo_data');if(error)$('#dz').innerHTML=`<p class="err">${esc(error.message)}</p>`;else go('admin')}};
const H=['shipper_ref','site_code','service','weight_lb','length_in','width_in','height_in','dest_city','dest_state','dest_zip','promised_date'];
$('#ct').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([H.join(',')+'\nREF-500001,A,ground,12.5,14,10,6,Atlanta,GA,30303,2026-12-01\n'],{type:'text/csv'}));a.download='shipment_import_template.csv';a.click()};
$('#cf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const out=$('#cr');const lines=(await f.text()).split(/\r?\n/).filter(x=>x.trim());const hd=lines[0].split(',').map(x=>x.trim().toLowerCase());const sh=ME.orgs.find(o=>o.kind==='shipper'),ca=ME.orgs.find(o=>o.kind==='carrier');const rows=[],bad=[];
lines.slice(1).forEach((ln,i)=>{const c=ln.split(',').map(x=>x.trim());const o={};hd.forEach((h,j)=>o[h]=c[j]);const site=ME.sites.find(s=>s.code.toUpperCase()===(o.site_code||'').toUpperCase());if(!o.shipper_ref||!site||!/^[A-Za-z]{2}$/.test(o.dest_state||'')){bad.push(i+2);return}const n=v=>v===''||v==null||isNaN(+v)?null:+v;rows.push({shipper_ref:o.shipper_ref,site_id:site.id,shipper_org_id:sh.id,carrier_org_id:ca.id,service:o.service||'ground',weight_lb:n(o.weight_lb),length_in:n(o.length_in),width_in:n(o.width_in),height_in:n(o.height_in),dest_city:o.dest_city||null,dest_state:o.dest_state.toUpperCase(),dest_zip:o.dest_zip||null,promised_date:/^\d{4}-\d{2}-\d{2}$/.test(o.promised_date||'')?o.promised_date:null})});
let done=0;for(let i=0;i<rows.length;i+=500){out.textContent=`Importing ${done} of ${rows.length}…`;const{error}=await sb.from('shipments').upsert(rows.slice(i,i+500),{onConflict:'shipper_ref'});if(error){out.innerHTML=`<span class="err">${esc(error.message)}</span>`;return}done+=Math.min(500,rows.length-i)}out.innerHTML=`<span class="ok">${f0(done)} shipments imported.</span>${bad.length?` <span class="err">${bad.length} rows skipped (missing ref, unknown site code or bad state): lines ${bad.slice(0,15).join(', ')}${bad.length>15?'…':''}</span>`:''}`}}

sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='INITIAL_SESSION'){if(ev==='SIGNED_IN'&&ME.role)return;if(!s)ME.role=null;setTimeout(()=>boot(s),0)}});
</script></body></html>
